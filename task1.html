<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/task1.css" rel="stylesheet">
</head>
<body>
  <nav>
    <ul class="nav nav-pills justify-content-center mt-4">
        <li class="nav-item">
            <a class="nav-link" href="task1.html">Task 1</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="task2.html">Task 2</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="task3.html">Task 3</a>
        </li>
    </ul>
    </nav>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">

        <section class="card booking">
          <h1 class="booking__header">Book a train ticket</h1>

          <form class="card-body p-3 p-md-4 p-lg-5" action="#" method="get">
            <div class="row g-3">

              <div class="col-12">
                <div class="trip d-inline-flex" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="trip-one" value="one-way" checked>
                  <label class="btn" for="trip-one">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="trip-round" value="round-trip">
                  <label class="btn" for="trip-round">Round trip</label>
                </div>
              </div>

              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from"
                         placeholder="Astana" autocomplete="off" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to"
                         placeholder="Almaty" autocomplete="off" required>
                  <label for="to">To</label>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <label class="form-label" for="departure">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="return">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="passengers">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>

              <fieldset class="col-12">
                <legend class="form-label">Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                  <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
                  <label class="form-check-label" for="coupe">Coupe</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                  <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
              </fieldset>

              <div class="col-12 col-md-6">
                <label class="form-label" for="phone">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" aria-hidden="true">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone"
                         placeholder="701 234 56 78" autocomplete="tel-national"
                         pattern="\d{3} ?\d{3} ?\d{2} ?\d{2}"
                         title="10 digits, for example 701 234 56 78" required>
                </div>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="name@example.com" autocomplete="email" required>
              </div>

              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="rules" name="rules" required>
                  <label class="form-check-label" for="rules">I agree with the carriage rules</label>
                </div>
              </div>

              <div class="col-12">
                <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-2">
                  <button type="reset" class="btn btn-clear">Clear</button>
                  <button type="submit" class="btn btn-find">Find trains</button>
                </div>
              </div>

            </div>
          </form>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
